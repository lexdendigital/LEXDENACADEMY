function openConfirm(a,email){
  const form=document.getElementById('assessmentForm'); collectForm(a,email); const currentEmail=emailKey(document.getElementById('studentEmail')?.value||email); email=currentEmail; const missing=missingRequired(form); if(missing.length){notify(`Complete the required sections before finalizing. Missing: ${missing.length} item(s).`,false);const first=form.querySelector(`[data-field-key="${CSS.escape(missing[0])}"]`);first?.scrollIntoView({behavior:'smooth',block:'center'});return;}
  const draft=collectForm(a,email); const checks=runAutoChecks(a,draft); const weak=checks.filter(x=>!x.ok);
  const backdrop=document.createElement('div');backdrop.className='modal-backdrop';backdrop.innerHTML=`<div class="modal"><div class="eyebrow">FINAL SUBMISSION GATE</div><h3>Are you truly ready to submit?</h3><p>After you confirm, this assignment is locked on this device/browser. You will download the encrypted <strong>.lexden</strong> file and a readable PDF report. You must attach the required file(s) back to Google Classroom.</p>${weak.length?`<div class="status show bad">Automatic completeness checks flagged ${weak.length} item(s). You may still proceed only when you have personally verified the content.</div>`:''}<p class="small">This system does not decide whether the work is correct. It only checks structure, required evidence fields and certain course-specific mechanical requirements.</p><label class="option"><input id="confirmReady" type="checkbox"> <span>I have reviewed my work and I am truly ready to submit this assignment.</span></label><div class="row"><button class="btn btn-ghost" data-cancel>Go back</button><button class="btn btn-primary" data-confirm disabled>Encrypt & download</button></div></div>`;
  document.body.appendChild(backdrop);const c=backdrop.querySelector('#confirmReady'),ok=backdrop.querySelector('[data-confirm]');c.addEventListener('change',()=>ok.disabled=!c.checked);backdrop.querySelector('[data-cancel]').onclick=()=>backdrop.remove();ok.onclick=async()=>{ok.disabled=true;try{const result=await buildSubmission(a,email);state.submissions[emailKey(result.draft.studentEmail||email)] ||= {};state.submissions[emailKey(result.draft.studentEmail||email)][a.id]={lockedAt:new Date().toISOString(),submissionId:result.submissionId};saveState();downloadBlob(new Blob([result.container],{type:'application/octet-stream'}),`${slugSafe(a.id)}-${slugSafe(result.draft.studentName||'student')}.lexden`);downloadBlob(new Blob([result.pdf.bytes],{type:'application/pdf'}),`${slugSafe(a.id)}-${slugSafe(result.draft.studentName||'student')}-submission-receipt.pdf`);backdrop.remove();renderWorkspace(a,email);notify('Submission finalized. The assignment is now locked on this device.',true);window.scrollTo({top:0,behavior:'smooth'});}catch(e){ok.disabled=false;notify(e.message||String(e),false)}};
}
function bindWorkspace(a,email){
  const form=document.getElementById('assessmentForm');
  const draft=getDraft(email,a.id); if(draft.studentEmail && emailKey(draft.studentEmail)!==emailKey(email)){email=draft.studentEmail}
  form.addEventListener('input',()=>{collectForm(a,email);updateProgress(a,email)});
  form.addEventListener('change',async e=>{
    if(e.target.matches('input[type=radio],input[type=checkbox],select')){collectForm(a,email);updateProgress(a,email)}
    const fileKey=e.target.dataset.fileKey;if(fileKey){window.__LEXDEN_SELECTED_FILES[fileKey]=Array.from(e.target.files||[]);document.getElementById('filemeta-'+fileKey).textContent=window.__LEXDEN_SELECTED_FILES[fileKey].length?formatFileList(window.__LEXDEN_SELECTED_FILES[fileKey]):'No files selected.';checkSizeBudget();updateProgress(a,email)}
    const csvKey=e.target.dataset.csvKey;if(csvKey){const file=e.target.files?.[0];if(!file)return;const text=await file.text();try{const parsed=validateProspectCsv(text);window.__LEXDEN_CSV_TEXT ||= {};window.__LEXDEN_CSV_RECORDS ||= {};window.__LEXDEN_CSV_TEXT[csvKey]=text;window.__LEXDEN_CSV_RECORDS[csvKey]=parsed.records;document.getElementById('csvstatus-'+csvKey).textContent='Valid: exactly 100 prospect rows.';document.getElementById('csvstatus-'+csvKey).style.color='var(--green)';window.__LEXDEN_SELECTED_FILES[csvKey]=[file];updateProgress(a,email);}catch(err){window.__LEXDEN_CSV_TEXT ||= {};window.__LEXDEN_CSV_TEXT[csvKey]='';window.__LEXDEN_CSV_RECORDS ||= {};window.__LEXDEN_CSV_RECORDS[csvKey]=[];document.getElementById('csvstatus-'+csvKey).textContent=err.message;document.getElementById('csvstatus-'+csvKey).style.color='var(--danger)';}}
  });
  document.querySelector('[data-action="csv-template"]')?.addEventListener('click',e=>{e.preventDefault();downloadBlob(makeCsvTemplate(),'LEXDEN-M4-100-prospect-template.csv')});
  document.getElementById('saveBtn')?.addEventListener('click',()=>{collectForm(a,email);notify('Draft saved locally on this device.',true)});
  document.getElementById('pdfBtn')?.addEventListener('click',()=>{collectForm(a,email);const pdf=window.LEXDEN_PDF.makePdf({title:a.title,lines:buildReportLines(a,getDraft(email,a.id)),filename:'submission-receipt.pdf'});downloadBlob(new Blob([pdf.bytes],{type:'application/pdf'}),`${slugSafe(a.id)}-submission-receipt.pdf`);notify('PDF report generated.',true)});
  document.getElementById('submitBtn')?.addEventListener('click',()=>openConfirm(a,email));
  checkSizeBudget();
}
function formatFileList(files){let total=files.reduce((n,f)=>n+f.size,0);const names=files.slice(0,4).map(f=>f.name).join(', ');return `${files.length} file(s), ${formatBytes(total)}${files.length>4?' • '+(files.length-4)+' more':''} • ${names}`;}
function formatBytes(n){const u=['B','KiB','MiB'];let i=0,x=n;while(x>=1024&&i<2){x/=1024;i++;}return `${x.toFixed(x<10&&i?1:0)} ${u[i]}`;}
function checkSizeBudget(){const all=Object.values(window.__LEXDEN_SELECTED_FILES).flat();const raw=all.reduce((n,f)=>n+f.size,0);const max=100*1024*1024;const n=document.getElementById('status');if(!n)return;if(raw>95*1024*1024){n.textContent=`Selected files total ${formatBytes(raw)} before ZIP/encryption overhead. Keep the final encrypted package under 100 MiB.`;n.className='status show '+(raw>max?'bad':'bad');} }
function bootstrap(){
  setLoadingDone(); if(COURSE_ID!==COURSE.courseId){renderGate('Unknown course link.');return;} const a=currentAssignment(); if(!a){renderGate('No assignment was specified in this link.');return;}
  const boot=getDraftIdentity(); const email=emailKey(boot.studentEmail||'');
  if(a.prerequisites.length&&!email){show(gate,true);show(workspace,false);gate.innerHTML=`<div class="card gate-card"><div class="eyebrow">${escapeHtml(a.module)} • ${escapeHtml(a.shortTitle)}</div><h2>Start with your Google Classroom email</h2><p>This assignment depends on a previous submitted assignment. Entering the same Classroom email in the previous assignment lets this device carry your progress forward.</p><div class="callout">Open the earlier assignment first, use the same Google Classroom email, finalize it, then return to this link.</div></div>`;return;}
  if(a.prerequisites.length&&!hasPrereqs(email,a)){show(gate,true);show(workspace,false);gate.innerHTML=`<div class="card gate-card"><div class="eyebrow">${escapeHtml(a.module)} • Locked</div><h2>Complete the previous assignment first</h2><p>This assignment is intentionally unavailable until the prerequisite submission is finalized on this device using the same Google Classroom email.</p><div class="assessment-list">${a.prerequisites.map(p=>`<div class="assessment-item ${getSubmission(email,p)?'done':''}"><span class="dot"></span>${escapeHtml(A[p]?.module||p)} · ${escapeHtml(A[p]?.shortTitle||p)}</div>`).join('')}</div></div>`;return;}
  const d=getDraft(email,a.id); if(!d.studentEmail && email){d.studentEmail=email;saveState();}
  renderWorkspace(a,email);
}
try{bootstrap()}catch(e){renderGate('The assessment could not load safely: '+e.message)}
})();
